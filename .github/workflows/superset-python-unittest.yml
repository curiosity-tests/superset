            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  unit-tests-required:
    needs: [changes, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad   # v3.2.0
      with:
        expand-composite-actions: true

    - name: Check unit-tests result
      env:
        RESULT: ${{ needs.unit-tests.result }}
      run: |
        if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
          echo "unit-tests did not pass (result: $RESULT)"
          exit 1
        fi
        echo "unit-tests result: $RESULT"
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
